org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
# All resolved Android dependencies use AndroidX; avoid Jetifier's large
# transforms of Flutter engine artifacts during debug builds.
android.enableJetifier=false
extra-gen-snapshot-options=--obfuscate
android.nonTransitiveRClass=false
android.nonFinalResIds=true
android.enableR8.fullMode=true
android.bundle.enableUncompressedNativeLibs=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin incremental caches cannot relativize sources between the C: Pub cache
# and this F: project. Compile without incremental caches for reliable builds.
kotlin.incremental=false
